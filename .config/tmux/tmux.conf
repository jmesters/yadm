set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"

# Plugin manager path
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

# Core behavior
set -g default-shell /bin/zsh
set -g prefix C-b
set -g prefix2 C-a
set -g set-titles off
set -g silence-action other

# Catppuccin configuration
set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style 'basic' # rounded is bugged in the latest version
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "directory user host"

set -g @catppuccin_status_modules_center "window"

set -g status-right-length 100
set -g status-left-length 100
#set -g status-left ""

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,ghostty:Tc"

#set -g @catppuccin_status_modules_right "directory user host session"

set -g pane-border-status top
set -g pane-border-format " #{pane_title} "

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#latest'

set -g @plugin 'omerxx/tmux-sessionx'

# Initialize TPM (keep this last)
run '~/.config/tmux/plugins/tpm/tpm'
